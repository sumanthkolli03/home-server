@version: 4.2
@include "scl.conf"

options {
    keep_hostname(yes);
    create_dirs(yes);
    ts_format(iso);
};

source s_docker {
    network(
        transport("udp")
        ip("0.0.0.0")
        port(5514)
        flags(syslog-protocol)
    );
};

destination d_percontainer {
    file("/logs/${PROGRAM}.log"
        create_dirs(yes)
        template("${ISODATE} ${MESSAGE}\n")
    );
};

log {
    source(s_docker); 
    destination(d_percontainer); 
};