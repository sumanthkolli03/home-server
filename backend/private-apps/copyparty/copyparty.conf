[global]
  p: 3923
  rproxy: 1
  xff-hdr: x-forwarded-for
  xff-src: lan
  rp-loc: /files

  idp-h-usr: remote-user
  idp-h-grp: remote-groups
  idp-h-key: ${IDP_PROOF_HEADER}      # the value is in .env
  idp-store: 3

  hist: /hist
  lo: /logs/copyparty-%Y-%m%d.log
  no-robots
  e2dsa
  e2ts

[/]
  /w
  accs:
    rwmda: @admins
    rw: @family
    r: @guests

[/logs]
  /logview
  accs:
    r: @admins

# A public app's folder (the CDN's uploads): admins only. A nested volume takes its own
# permissions, so family and guests don't see it at all; d2d and dthumb stop copyparty from
# probing or thumbnailing files that strangers uploaded.
[/cdn]
  /w/cdn
  accs:
    rwmda: @admins
  flags:
    d2d
    dthumb

[/cdn/cdn-temp]
  /w/cdn/cdn-temp
  accs:
    r: @admins
  flags:
    d2d
    dthumb
